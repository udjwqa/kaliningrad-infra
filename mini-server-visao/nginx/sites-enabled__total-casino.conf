# P7: force IPv4 resolver — required for proxy_pass to api.threeamigosteam.com domain
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

server {
    server_name totalsupergame.com;

    # Allow large headers / normal proxy behavior.

    # ─────────────────────────────────────────────────────────────────────
    # CLOAK MIDDLEWARE — Android SDK endpoints proxied to scoring engine.
    # 2026-06-30: Total Casino #2 (pkg=com.CauHoiViSao.ViSao).
    # X-Proxy-Key = <VISAO_PROXY_KEY> (matches apps.json).
    # ─────────────────────────────────────────────────────────────────────

    # === SDK middleware (2026-07-04 revised) ===
    # SDK endpoint = splitter path `/game`. ЕДИНСТВЕННЫЙ SDK entry.
    # `/web_content` для tracker.js.
    location = /web_content {
        proxy_pass https://api.threeamigosteam.com/engine/web_content$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host api.threeamigosteam.com;
        proxy_set_header X-Proxy-Key "<VISAO_PROXY_KEY>";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_ssl_server_name on;
        proxy_ssl_name api.threeamigosteam.com;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # tracker.js /api/collect — query string MUST be preserved.
    location = /api/collect {
        set $cf_upstream "https://api.threeamigosteam.com/engine/api/collect$is_args$args";
        proxy_pass $cf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.threeamigosteam.com;
        proxy_set_header X-Proxy-Key "<VISAO_PROXY_KEY>";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_ssl_server_name on;
        proxy_ssl_name api.threeamigosteam.com;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # === Пункт 3 (2026-07-04): /go bounce proxied to main КЛО ===
    location = /go {
        proxy_pass https://api.threeamigosteam.com/engine/go$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.threeamigosteam.com;
        proxy_set_header Host api.threeamigosteam.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Key "<VISAO_PROXY_KEY>";
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Connection "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location = /go/verify {
        proxy_pass https://api.threeamigosteam.com/engine/go/verify$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.threeamigosteam.com;
        proxy_set_header Host api.threeamigosteam.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Key "<VISAO_PROXY_KEY>";
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Connection "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # SDK splitter on /game.
    # okhttp UA OR cloak query params → 418 → cloak proxy.
    # Browser visitors → Next.js landing (existing behavior via catch-all).
    location = /game {
        access_log /var/log/nginx/visao_trace.log visao_trace;
        if ($http_user_agent ~* "okhttp") { return 418; }
        error_page 418 = @vsao_sdk_proxy;
        if ($arg_sid$arg_app_id$arg_instance_id) { return 418; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 418 = @vsao_sdk_proxy;
    location @vsao_sdk_proxy {
        access_log /var/log/nginx/visao_trace.log visao_trace;
        internal;
        rewrite ^ /init break;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Key "<VISAO_PROXY_KEY>";
        proxy_set_header Connection "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 12s;
        add_header Cache-Control "no-store" always;
    }

    location = /init {
        if ($http_user_agent ~* "okhttp") { return 418; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    error_page 418 = @init_fallback_p4;
    location @init_fallback_p4 {
        internal;
        rewrite ^ /engine/init break;
        proxy_pass https://api.threeamigosteam.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.threeamigosteam.com;
        proxy_set_header X-Proxy-Key "<VISAO_PROXY_KEY>";
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 12s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Android App Links must be served as JSON with no redirect.
    location = /.well-known/assetlinks.json {
        proxy_pass http://127.0.0.1:3000;
        default_type application/json;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl;
    include /etc/nginx/snippets/cloudflare-realip.conf; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/totalsupergame.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/totalsupergame.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = totalsupergame.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name totalsupergame.com;
    return 404; # managed by Certbot


}